<!doctype html>
<meta charset="utf-8">
<title>the fawn and the butterfly</title>
<style>
  body{margin:0;background:#17150f;color:#d8cfc0;font:13px/1.55 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
  canvas#c{width:min(94vw,1120px);height:auto;box-shadow:0 14px 44px rgba(0,0,0,.6)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#26221d;color:#e4d9c6;border:1px solid #514636;padding:5px 12px;cursor:pointer;font:inherit;border-radius:3px}
  button:hover{background:#332d26}
  input[type=range]{width:320px}
  .cap{max-width:840px;text-align:center;opacity:.6}
</style>
<canvas id="c"></canvas>
<p class="cap">the fawn and the butterfly &mdash; twenty-one seconds, every frame drawn in JavaScript on a 2D canvas (riso: 3&ndash;4 halftone inks, misregistration, one seed dot). music by <b>soundtrack.py</b>, composed in Python and mixed in below.</p>
<script src="assets/core.js"></script>
<script src="assets/actors.js"></script>
<script src="assets/letters.js"></script>
<script>
'use strict';
// ============================================================
// THE FAWN AND THE BUTTERFLY
//
// A riso-printed flipbook: cream stock, three or four halftone inks per shot,
// every edge off register, one navy seed dot at the centre of the frame for the
// whole film. The whole world is a pure function of world x, so the camera can
// travel anywhere along the meadow and the grass stands still under it.
//
// Beat sheet
//   t     dur   shot          camera                        story
//   0.0   3.0   the meadow    slow push in                  mother grazes, the fawn nuzzles her, both look up
//   3.0   2.0   the shadow    push in, the light drains      a tiger comes out of the treeline, low in the grass
//   4.9   4.5   the run       hard pan left, then a cut      the chase, the split, the fawn alone and out of breath
//   9.4   2.0   alone         locked off, slow push          the call, the tears, the wind, everything grey
//   11.4  3.0   the butterfly gentle push, warm returns     a butterfly comes down out of the light and lands on his nose
//   14.4  3.0   follow        tracking right at a trot       he follows it across the meadow; far off, a shape that might be her
//   17.4  3.6   home          settles and holds              they meet, the light goes gold, the butterfly lifts away
// ============================================================

// ---------- inks: one set per beat, three or four plates, never more ----------
const SET = {
  warm: { sky: INKS.ochre, sky2: INKS.pale, sun: INKS.pale, cloud: INKS.cream, hill: INKS.tan, hillNear: INKS.ochre, tree: INKS.navy,
    ground: INKS.tan, ground2: INKS.olive, grass: INKS.olive, grass2: INKS.green, light: INKS.cream, shade: INKS.navy, haze: INKS.pale, sunY: 430, wash: null, washAl: 0, k: 1.0 },
  tense: { sky: INKS.orange, sky2: INKS.pale, sun: INKS.pale, cloud: INKS.cream, hill: INKS.ochre, hillNear: INKS.orange, tree: INKS.indigo,
    ground: INKS.ochre, ground2: INKS.olive, grass: INKS.olive, grass2: INKS.green, light: INKS.pale, shade: INKS.indigo, haze: INKS.ochre, sunY: 470, wash: null, washAl: 0, k: 1.2 },
  cold: { sky: INKS.slate, sky2: INKS.pale, sun: INKS.cream, cloud: INKS.cream, hill: INKS.slate, hillNear: INKS.navy, tree: INKS.indigo,
    ground: INKS.slate, ground2: INKS.olive, grass: INKS.olive, grass2: INKS.green, light: INKS.cream, shade: INKS.navy, haze: INKS.pale, sunY: 560, wash: null, washAl: 0, k: 1.45 },
  hope: { sky: INKS.ochre, sky2: INKS.pale, sun: INKS.pale, cloud: INKS.cream, tree: INKS.navy,
    ground: INKS.tan, ground2: INKS.green, grass: INKS.olive, grass2: INKS.green, light: INKS.cream, shade: INKS.navy, haze: INKS.pale, sunY: 400, wash: null, washAl: 0, k: 1.0 },
};
// the meadow, back to front. Every layer rides a fraction of the camera.
function stage(c, camX, S, seed, o = {}) {
  sky(c, camX, S, seed);
  treeline(c, camX, S, seed + 7);
  meadow(c, camX, S, seed + 11, o);
  haze(c, camX, S, (S.hazeAl ?? .3) * (o.hazeK ?? 1) * (o.hazeAl ?? 1));
}
// the camera for a shot: a pan plus a little handheld drift
function look(c, tau, K, o = {}) { camKeys(c, tau, K, { ease: easeInOutSine, hand: o.hand ?? 3.5, seed: o.seed ?? 9 }); }
// a torn paper edge that wipes the frame: drawn, never blended
function wipeDown(c, tau, dur, seed, color) {
  if (tau >= dur) return;
  const p = easeOut(clamp(tau / dur, 0, 1)), y = lerp(H + 120, -80, p);
  resetT(c);
  const path = new Path2D();
  path.moveTo(-40, -80); path.lineTo(-40, y);
  for (let x = -40; x <= W + 40; x += 8) path.lineTo(x, y + (h2(x * .011, seed) - .5) * 58 + Math.sin(x / 74) * 26 + Math.sin(x / 19) * 8);
  path.lineTo(W + 40, -80); path.closePath();
  c.save(); c.globalAlpha = .2; c.fillStyle = INKS.navy; c.translate(0, 14); c.fill(path); c.restore();
  c.fillStyle = color || STOCK; c.fill(path);
  c.save(); c.globalAlpha = .55; c.strokeStyle = INKS.navy; c.lineWidth = 2.6; c.setLineDash([18, 12]); c.stroke(path); c.restore();
}
// the light that sits over a finished frame, plus the vignette, plus grain
function moodPass(c, S, seed) {
  resetT(c);
  if (S.wash) { c.save(); c.globalCompositeOperation = 'multiply'; c.globalAlpha = S.washAl; c.fillStyle = S.wash; c.fillRect(0, 0, W, H); c.restore(); }
  const g = c.createRadialGradient(CX, CY - 30, 560, CX, CY, 1260);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, alpha(INKS.navy, .12));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  grain(c, rectPath(0, 0, W, H), [0, 0, W, H], 1100, INKS.tan, .07, seed, 1.8);
}
// the stock: every frame starts as a sheet of the same cream paper
function stock(c) { paper(c, STOCK, null, 5); }
// the seed dot: the same mark, the same place, in every frame of the film
function seedDot2(c) { resetT(c); seedDot(c, CX, CY, 12, INKS.navy, INKS.plum); }
// impact: dust and a flash of pale on a hard cut
function impact(c, tau, t, al = .45) {
  const k = clamp(1 - (tau - t) / .26, 0, 1); if (k <= 0) return;
  resetT(c); c.save(); c.globalAlpha = al * k; c.fillStyle = INKS.cream; c.fillRect(0, 0, W, H); c.restore();
  c.save(); c.globalAlpha = .3 * k; c.strokeStyle = INKS.shade; c.lineWidth = 3;
  for (let k2 = 0; k2 < 22; k2++) { const a = h2(k2, 5) * TAU2, r0 = 160 + h2(k2, 6) * 360; c.beginPath(); c.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0 * .72); c.lineTo(CX + Math.cos(a) * (r0 + 120 + k2 * 10), CY + Math.sin(a) * (r0 + 90) * .72); c.stroke(); }
  c.restore();
}

// ============================================================
// SHOT 1 — the meadow (0.0 - 3.0)
// ============================================================
function shotMeadow(c, tau, i) {
  const S = SET.warm, seed = 31, boil = i % 2; stock(c);
  const tauC = tau;                                  // the camera runs on ones
  const K = [[0, 380, CY + 30, 1.0], [1.6, 470, CY + 24, 1.05], [3.0, 548, CY + 18, 1.1]];
  const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
  look(c, tauC, K, { hand: 3, seed: 4 });
  tau = twos(tau);                                   // the drawing runs on twos
  stage(c, camX, S, seed, { top: HORIZON + 40 });
  // the pair, standing in the grass
  const mx = camX + 10, fx = camX + 330;
  const graze = tau < 1.5 ? -0.95 + Math.sin(tau * 2.1) * .16 : lerp(-0.95, .3, sm(1.5, 1.95, tau)) + Math.sin(tau * 1.4) * .05;
  cam(c, camX, CY, 1);
  deerDraw(c, mx, GROUND, 1.2, { walk: tau * .35, stride: 9, liftH: 5, headUp: graze, boil, tailLift: .15, blink: (i % 7) === 0 }, seed, false);
  // the fawn: nuzzling her flank, then a small hop, then grazing too
  const hop = tau > 2.05 && tau < 2.55 ? Math.max(0, Math.sin(sm(2.05, 2.55, tau) * Math.PI)) * 34 : 0;
  const nuzzle = sm(.9, 1.5, tau);
  const fxw = fx + Math.sin(tau * .9) * 16 - nuzzle * 56;
  deerDraw(c, fxw, GROUND, .86, { walk: tau * .55, stride: 11, liftH: 8, headUp: tau < 2.05 ? .5 + Math.sin(tau * 1.7) * .1 : .25, air: hop, boil, blink: (i % 5) === 0, tailLift: .5 }, seed + 4, true);
  // grass in front of their hooves, so they stand in it rather than on it
  cam(c, camX, CY, 1);
  meadow(c, camX, S, seed + 77, { top: GROUND - 60, density: .34, blade: 1.05 });
  // a few insects, and one early butterfly far off (it comes back in shot 5)
  c.save();
  for (let k = 0; k < 16; k++) {
    const px = camX - 900 + ((h2(k, 9) * 1800 + tau * (24 + h2(k, 3) * 40)) % 1800);
    const py = 500 + h2(k, 12) * 340 + Math.sin(tau * 2 + k) * 22;
    c.globalCompositeOperation = 'multiply'; c.globalAlpha = .5 + .35 * Math.sin(tau * 3 + k);
    c.fillStyle = INKS.tan; c.beginPath(); c.arc(px, py, 4 + h2(k, 8) * 3, 0, TAU2); c.fill();
  }
  c.restore();
  moodPass(c, S, seed);
  seedDot2(c);
  wipeDown(c, tauC, .38, 12, STOCK);
}

// ============================================================
// SHOT 2 — the shadow (3.0 - 4.9)
// ============================================================
function shotShadow(c, tau, i) {
  const S = SET.tense, seed = 47, boil = i % 2; stock(c);
  const tauC = tau;
  const K = [[0, 548, CY + 18, 1.1], [2.0, 628, CY + 8, 1.17]];
  const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
  look(c, tauC, K, { hand: 5, seed: 21 });
  tau = twos(tau);
  const dark = sm(.4, 1.7, tau);
  stage(c, camX, S, seed, { top: HORIZON + 40, hazeK: 1 + dark * .4 });
  cam(c, camX, CY, 1);
  // the tiger comes in from the right, low, most of it behind the grass
  const tx = camX + 1180 - sm(.12, 1.95, tau, easeOut) * 720;
  tigerDraw(c, tx, GROUND - 96, .76, { walk: tau * .42, stride: 16, liftH: 7, boil, roll: -.02, ink1: INKS.ochre }, seed + 5);
  // the mother: the whole performance is the pause before the head comes up
  const alert = tau < 1.12 ? 0 : sm(1.12, 1.52, tau);
  const graze = lerp(-.9 + Math.sin(tau * 1.9) * .12, .62, alert);
  deerDraw(c, camX + 20, GROUND, 1.2, { walk: 0, stride: 7, liftH: 4, headUp: graze, boil, alert: alert > .5, blink: (i % 6) === 0, tailLift: .3 }, seed, false);
  // the fawn stops nuzzling and presses against her
  deerDraw(c, camX + 290 - alert * 50, GROUND, .86, { walk: 0, stride: 7, liftH: 4, headUp: lerp(.5, .15, alert), boil, alert: alert > .6, blink: (i % 4) === 0, tailLift: .1 }, seed + 4, true);
  // grass in front of the tiger, as if it were already close
  meadow(c, camX, S, seed + 77, { top: GROUND - 150, density: .26, blade: 1.3 });
  // darkness pools around the predator
  cam(c, camX, CY, 1);
  const txs = tx - camX + CX;
  halftone(c, ellPath(txs, GROUND - 120, 980, 620), [txs - 1000, GROUND - 760, 2000, 1280], { cell: 14, color: INKS.indigo,
    density: (x, y) => clamp(1 - Math.hypot((x - txs) / 980, (y - (GROUND - 120)) / 620), 0, 1) ** 1.4 * .5, bands: 7, seed: seed + 9, alpha: .6 * dark });
  moodPass(c, S, seed);
  seedDot2(c);
  wipeDown(c, tauC, .3, 14, STOCK);
}

// ============================================================
// SHOT 3 — the run (4.9 - 9.4): the chase, the split, and the quiet after
// ============================================================
const RUN_CUT = 2.5;
function shotRun(c, tau, i) {
  const S = SET.tense, seed = 63, boil = i % 2; stock(c);
  const tauC = tau;
  if (tau < RUN_CUT) {
    const K = [[0, 700, CY + 8, 1.17], [1.1, 120, CY + 14, 1.15], [2.0, -620, CY + 18, 1.13], [RUN_CUT, -1450, CY + 20, 1.1]];
    const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
    look(c, tauC, K, { hand: 9, seed: 33 });
    tau = twos(tau);
    stage(c, camX, S, seed, { top: HORIZON + 40 });
    cam(c, camX, CY, 1);
    // she runs hard and low, and keeps looking back over her shoulder
    const mw = tau * 3.2;
    deerDraw(c, camX - 400, GROUND, 1.2, { walk: mw, stride: 46, liftH: 24, headUp: -.05, roll: -.02, boil, tailLift: .9, air: Math.abs(Math.sin(mw * Math.PI)) * 30, ground: 0 }, seed, false);
    // he runs beside her, a stride back and to the right
    const fw = tau * 3.7 + .4;
    deerDraw(c, camX - 120, GROUND, .86, { walk: fw, stride: 40, liftH: 22, headUp: .15, boil, tailLift: 1, air: Math.abs(Math.sin(fw * Math.PI)) * 26, alert: true }, seed + 4, true);
    // the tiger closes from the right, then crosses the lens
    const close = sm(0, RUN_CUT, tau, easeInOutSine);
    const zoom = 1 + sm(1.75, RUN_CUT, tau) * .55;
    const dz = sm(1.75, RUN_CUT, tau);
    tigerDraw(c, camX + 1560 - close * 980, GROUND + dz * 210, .88 * zoom, { walk: tau * 3.5, stride: 56, liftH: 28, boil, roll: .03, air: Math.abs(Math.sin(tau * 3.5 * Math.PI)) * 22 }, seed + 9);
    // dust behind all three, and the wind of the run
    dust(c, camX - 560, GROUND + 8, tau, seed + 3, { al: .46, size: 40 });
    dust(c, camX + 1200, GROUND + 24, tau, seed + 9, { al: .3, size: 52 });
    speedLines(c, camX - 330, GROUND - 120, 1, 12, 200 + close * 220, seed + 21 + (tau * 12 | 0), INKS.tan, .18 + close * .12);
    if (close > .5) speedLines(c, camX + 320, GROUND - 150, 1, 14, 220 + close * 300, seed + 31 + (tau * 12 | 0), INKS.tan, .14 + close * .14);
    moodPass(c, S, seed);
    seedDot2(c);
    impact(c, tauC, RUN_CUT - .05, .5);
    return;
  }
  // ---- after the cut: another part of the meadow, and one small shape in it
  const t2 = tau - RUN_CUT, seed2 = seed + 100;
  const K = [[0, 3400, CY + 24, 1.0], [1.4, 3470, CY + 16, 1.07], [2.0, 3500, CY + 10, 1.12]];
  const camX = keyPath(t2, K, { ease: easeInOutSine })[0];
  look(c, t2, K, { hand: 4, seed: 51 });
  tau = twos(tau);
  stage(c, camX, SET.cold, seed2, { top: HORIZON + 40, hazeAl: .6 });
  cam(c, camX, CY, 1);
  // he slows from a gallop to nothing, out of breath, and looks for her
  const slow = sm(0, .9, t2, easeOut);
  const lk = Math.sin(t2 * 1.5);
  deerDraw(c, camX + 160 - slow * 70, GROUND, .86, { walk: (tau - .8) * .9, stride: lerp(38, 6, slow), liftH: lerp(20, 4, slow),
    headUp: lerp(.15, .5, slow) + lk * .12, roll: lk * .04, boil, alert: true, blink: (i % 5) === 0, tears: t2 > 1.3, tailLift: lerp(.9, .1, slow),
    air: slow < .9 ? Math.abs(Math.sin(tau * 3.2 * Math.PI)) * 20 * (1 - slow) : 0 }, seed + 40, true);
  // the dust of the chase drifting away to the left, and thinning
  dust(c, camX - 300, GROUND + 8, tau, seed + 6, { al: .3 * (1 - sm(.2, 1.5, t2)), size: 34, spread: 520 });
  speedLines(c, camX - 620, GROUND - 110, 1, 9, 190, seed + 51 + (tau * 12 | 0), INKS.tan, .16 * (1 - sm(0, 1.1, t2)));
  // the wind gets up in the empty field
  meadow(c, camX, SET.cold, seed + 61, { top: GROUND - 70, density: .28, blade: 1 + .12 * Math.sin(t2 * 2.6) });
  moodPass(c, SET.cold, seed2);
  seedDot2(c);
  impact(c, tauC, RUN_CUT, .55);
}

// ============================================================
// SHOT 4 — alone (9.4 - 11.4)
// ============================================================
function shotAlone(c, tau, i) {
  const S = SET.cold, seed = 71, boil = i % 2; stock(c);
  const tauC = tau;
  const K = [[0, 3500, CY + 10, 1.14], [2.0, 3492, CY + 2, 1.24]];
  const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
  look(c, tauC, K, { hand: 2.2, seed: 61 });
  tau = twos(tau);
  stage(c, camX, S, seed, { top: HORIZON + 40, hazeAl: .6 });
  cam(c, camX, CY, 1);
  // the call: he breathes, gathers himself, and cries out twice
  const cry = (t0) => Math.max(0, Math.sin(clamp((tau - t0) / .58, 0, 1) * Math.PI));
  const c1 = cry(.35), c2 = cry(1.05);
  const heave = Math.sin(tau * 3.4) * .05;
  deerDraw(c, camX, GROUND, .9, { walk: tau * .5, stride: lerp(10, 4, sm(0, .6, tau)), liftH: 4,
    headUp: .35 + c1 * .5 + c2 * .45 + heave, boil, sad: true, tears: true, alert: tau < .4, blink: (i % 4) === 0 }, seed + 4, true);
  // the sound carries: rings leaving the muzzle, printed pale on the grey
  c.save();
  for (let k = 0; k < 4; k++) {
    const ph = (tau * 1.1 + k * .25) % 1;
    c.globalAlpha = .3 * (1 - ph) * (.5 + (c1 + c2) * .7); c.strokeStyle = INKS.cream; c.lineWidth = 5;
    c.beginPath(); c.ellipse(camX + 90, GROUND - 150 - ph * 60, 26 + ph * 260, 18 + ph * 150, 0, 0, TAU2); c.stroke();
  }
  c.restore();
  // a long blade of grass moving in front, and the wind across the whole field
  meadow(c, camX, S, seed + 41, { top: GROUND - 64, density: .28, blade: 1.15 + .25 * Math.sin(tau * 2.1) });
  // a few leaves torn loose and blown past
  c.save(); c.globalCompositeOperation = 'multiply';
  for (let k = 0; k < 10; k++) {
    const px = camX - 800 + ((h2(k, 3) * 1600 + tau * (150 + h2(k, 4) * 100)) % 1600);
    const py = 480 + h2(k, 5) * 420 + Math.sin(tau * 1.6 + k * 2) * 48;
    c.save(); c.translate(px, py); c.rotate(tau * 2 + k); c.globalAlpha = .45;
    c.fillStyle = INKS.olive; c.beginPath(); c.ellipse(0, 0, 16, 6, 0, 0, TAU2); c.fill();
    c.restore();
  }
  c.restore();
  moodPass(c, S, seed);
  seedDot2(c);
  wipeDown(c, tauC, .3, 16, STOCK);
}

// ============================================================
// SHOT 5 — the butterfly (11.4 - 14.4)
// ============================================================
function shotButterfly(c, tau, i) {
  const S = SET.hope, seed = 83, boil = i % 2; stock(c);
  const tauC = tau;
  const K = [[0, 3470, CY + 14, 1.18], [1.5, 3484, CY + 6, 1.34], [3.0, 3500, CY, 1.5]];
  const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
  look(c, tauC, K, { hand: 2.4, seed: 71 });
  tau = twos(tau);
  const warm = sm(.2, 1.6, tau);
  const S2 = warm > .5 ? SET.hope : SET.cold;   // the colour comes back with the butterfly
  stage(c, camX, S2, seed, { top: HORIZON + 40, hazeAl: 1 });
  cam(c, camX, CY, 1);
  // the fawn, still sad, lifts his head because something is arriving
  const see = sm(1.35, 1.95, tau), nuzzle = sm(2.3, 2.8, tau);
  const headUp = .42 + see * .32 - nuzzle * .1 + Math.sin(tau * 1.2) * .04;
  deerDraw(c, camX, GROUND, .9, { walk: tau * .3, stride: 5, liftH: 3, headUp, boil, sad: !see, tears: !see, alert: see > .4, blink: (i % 6) === 0 }, seed + 4, true);
  // the butterfly: it comes down out of the light, circles him, and lands on his nose
  const p = sm(.12, 2.45, tau, easeInOutSine);
  const path = bez([camX + 760, 190], [camX + 380, 120], [camX + 210, 430], [camX + 118, GROUND - 276], p);
  const bx = path[0] + Math.sin(tau * 3.1) * 26, by = path[1] + Math.cos(tau * 2.6) * 20;
  const scale = lerp(.85, .5, sm(.15, 2.4, tau));
  butterflyDraw(c, bx, by, scale, tau * 1.6, seed + 20);
  // the light gathers around it — the way home is easy to see
  halftone(c, circPath(bx, by, 330), [bx - 340, by - 340, 680, 680], { cell: 13, color: INKS.pale,
    density: (x, y) => clamp(1 - Math.hypot(x - bx, y - by) / 330, 0, 1) * .5 * see, bands: 8, seed: seed + 3 });
  meadow(c, camX, S2, seed + 31, { top: GROUND - 60, density: .24, blade: 1.02 });
  moodPass(c, S2, seed);
  seedDot2(c);
  wipeDown(c, tauC, .28, 18, STOCK);
}

// ============================================================
// SHOT 6 — follow (14.4 - 17.4)
// ============================================================
function shotFollow(c, tau, i) {
  const S = SET.hope, seed = 97, boil = i % 2; stock(c);
  const tauC = tau;
  const K = [[0, 3510, CY + 16, 1.32], [1.4, 4060, CY + 8, 1.26], [3.0, 4560, CY + 2, 1.22]];
  const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
  look(c, tauC, K, { hand: 5, seed: 81 });
  tau = twos(tau);
  stage(c, camX, S, seed, { top: HORIZON + 40 });
  cam(c, camX, CY, 1);
  // he trots after it, and his tail has come back up
  const w = tau * 3.0;
  deerDraw(c, camX + 40, GROUND + 6, .86, { walk: w, stride: 34, liftH: 16, headUp: .45 + Math.sin(tau * 2.2) * .07, boil, alert: true,
    air: Math.abs(Math.sin(w * Math.PI)) * 26, tailLift: .85 }, seed + 4, true);
  // the butterfly keeps just ahead of his nose
  butterflyDraw(c, camX + 360 + Math.sin(tau * 2.2) * 52, GROUND - 330 - Math.sin(tau * 3.1) * 38, .5, tau * 1.8, seed + 20);
  // and far off, low against the light, a shape that might be her
  const mx = camX - 830 - sm(1.4, 2.6, tau) * 240;
  c.save(); c.globalAlpha = .62 * sm(.7, 1.7, tau);
  deerDraw(c, mx, GROUND - 4, .82, { walk: tau * .8, stride: 18, liftH: 9, headUp: .32, boil, tailLift: .3 }, seed + 60, false);
  c.restore();
  dust(c, camX + 10, GROUND + 10, tau, seed + 2, { al: .3, size: 22, spread: 170 });
  speedLines(c, camX + 430, GROUND - 120, 1, 10, 190 + sm(0, 2, tau) * 120, seed + 41 + (tau * 12 | 0), INKS.tan, .2);
  meadow(c, camX, S, seed + 11, { top: GROUND - 56, density: .26, blade: 1.05 });
  moodPass(c, S, seed);
  seedDot2(c);
  wipeDown(c, tauC, .26, 20, STOCK);
}

// ============================================================
// SHOT 7 — home (17.4 - 21.0)
// ============================================================
function shotHome(c, tau, i) {
  const S = SET.hope, seed = 109, boil = i % 2; stock(c);
  const tauC = tau;
  const K = [[0, 4560, CY + 8, 1.4], [1.3, 4680, CY, 1.32], [2.4, 4780, CY - 8, 1.24], [3.6, 4820, CY - 12, 1.18]];
  const camX = keyPath(tauC, K, { ease: easeInOutSine })[0];
  look(c, tauC, K, { hand: 3.4, seed: 91 });
  tau = twos(tau);
  stage(c, camX, S, seed, { top: HORIZON + 40 });
  cam(c, camX, CY, 1);
  const meet = sm(.35, 1.35, tau, easeOut);
  const hug = sm(1.35, 2.05, tau);
  const nuzzle = hug * (1 - sm(2.9, 3.5, tau));
  const mx = camX - 430 + meet * 330, fx = camX + 250 - meet * 300;
  // mother: she stops, then dips her head over him
  deerDraw(c, mx, GROUND, 1.34, { walk: tau * 2.6 * (1 - meet), stride: lerp(40, 4, meet), liftH: lerp(22, 3, meet), headUp: .25 + nuzzle * .5,
    roll: -.03, boil, air: (1 - meet) * Math.abs(Math.sin(tau * 2.6 * Math.PI)) * 26, alert: meet > .9 && hug < .3, blink: (i % 6) === 0, tailLift: .75 - nuzzle * .55 }, seed, false);
  // fawn: he runs the last of it and buries his head in her flank
  deerDraw(c, fx, GROUND, .96, { walk: tau * 3.2 * (1 - meet * .8), stride: lerp(38, 5, meet), liftH: lerp(20, 3, meet), headUp: .3 - nuzzle * .1,
    boil, air: (1 - meet) * Math.abs(Math.sin(tau * 3.2 * Math.PI)) * 28, alert: meet < .9, blink: (i % 4) === 0, tailLift: .95 }, seed + 4, true);
  // contact: the moment they touch, a soft burst of drawn sparks
  if (hug > 0) {
    const k = clamp(1 - (tau - 1.35) / .7, 0, 1);
    c.save(); c.globalAlpha = k * .5; c.strokeStyle = INKS.pale; c.lineWidth = 4; c.lineCap = 'round';
    for (let n2 = 0; n2 < 22; n2++) { const a = h2(n2, 4) * TAU2, r0 = 70 + h2(n2, 6) * 46;
      c.beginPath(); c.moveTo(fx - 30 + Math.cos(a) * r0, GROUND - 150 + Math.sin(a) * r0 * .8);
      c.lineTo(fx - 30 + Math.cos(a) * (r0 + 80 + 70 * (1 - k)), GROUND - 150 + Math.sin(a) * (r0 + 64 + 56 * (1 - k)) * .8); c.stroke(); }
    c.restore();
  }
  // the butterfly, its job done, climbs into the light
  const up = sm(.6, 3.3, tau);
  c.save(); c.globalAlpha = 1 - sm(2.8, 3.4, tau);
  butterflyDraw(c, fx + 230 - up * 460 + Math.sin(tau * 2) * 36, GROUND - 340 - up * 800, .56, tau * 1.5, seed + 20);
  c.restore();
  // petals and seedheads drifting through the gold
  c.save(); c.globalCompositeOperation = 'multiply';
  for (let k = 0; k < 24; k++) {
    const px = camX - 1300 + ((h2(k, 2) * 2600 + tau * (60 + h2(k, 7) * 70)) % 2600);
    const py = 380 + h2(k, 5) * 540 + Math.sin(tau * 1.4 + k * 1.7) * 42 - sm(0, 3.6, tau) * 70;
    c.save(); c.translate(px, py); c.rotate(tau * .8 + k); c.globalAlpha = .5;
    c.fillStyle = k % 3 ? INKS.cream : INKS.rose; c.beginPath(); c.ellipse(0, 0, 10 + h2(k, 9) * 9, 4 + h2(k, 3) * 4, 0, 0, TAU2); c.fill(); c.restore();
  }
  c.restore();
  meadow(c, camX, S, seed + 11, { top: GROUND - 60, density: .24, blade: 1.0 });
  moodPass(c, S, seed);
  // the light goes gold, then warmer still as the shot holds
  resetT(c);
  c.save(); c.globalCompositeOperation = 'multiply'; c.globalAlpha = sm(.05, 2.0, tau) * .2; c.fillStyle = INKS.orange; c.fillRect(0, 0, W, H); c.restore();
  c.save(); c.globalAlpha = sm(1.3, 2.6, tau) * .1; c.fillStyle = INKS.cream; c.fillRect(0, 0, W, H); c.restore();
  // the sign-off: two words in two inks, one dot each. Every film by this
  // author ends the same way, so this one does too.
  if (tau > 2.6) {
    resetT(c);
    const p = sm(2.6, 3.0, tau), p2 = sm(3.0, 3.3, tau);
    c.save(); c.globalAlpha = .92;
    write(c, 'together'.slice(0, Math.round(8 * p)), CX, H - 168, 104, { ink: INKS.navy, ink2: INKS.plum, align: 'center', offset: 8 });
    if (p2 > 0) write(c, 'at last'.slice(0, Math.round(7 * p2)), CX, H - 66, 70, { ink: INKS.indigo, ink2: INKS.rose, align: 'center', offset: 6, seed: 11 });
    seedDot(c, CX - 300, H - 232, 9, INKS.navy, INKS.plum);
    seedDot(c, CX + 300, H - 232, 9, INKS.plum, INKS.navy);
    c.restore();
  }
  seedDot2(c);
}

// ============================================================
defineFilm({
  palette: 'paperInk',
  fps: 24,
  format: { ar: '16:9', width: 1920 },
  timeline: [
    { name: 'the meadow',    dur: 3.0, fn: shotMeadow },
    { name: 'the shadow',    dur: 2.0, fn: shotShadow },
    { name: 'the run',       dur: 4.5, fn: shotRun },
    { name: 'alone',         dur: 2.0, fn: shotAlone },
    { name: 'the butterfly', dur: 3.0, fn: shotButterfly },
    { name: 'follow',        dur: 3.0, fn: shotFollow },
    { name: 'home',          dur: 3.6, fn: shotHome },
  ],
});

// ---------- keep the Python score in sync with the player when it is there ----------
(function () {
  const bar = document.querySelector && document.querySelector('.bar'); if (!bar) return;
  const a = document.createElement('audio');
  a.id = 'track'; a.src = 'soundtrack.wav'; a.preload = 'auto'; a.style.display = 'none';
  document.body.appendChild(a);
  const seek = () => { const s = bar.querySelector('#scrub'); if (s) a.currentTime = (+s.value) / (window.__fps || 24); };
  const play = bar.querySelector('#play');
  if (play) play.addEventListener('click', () => { if (play.textContent.trim() === 'pause') { seek(); a.play().catch(() => {}); } else a.pause(); });
  const scrub = bar.querySelector('#scrub'); if (scrub) scrub.addEventListener('input', seek);
})();
</script>
